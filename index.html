<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقارنة ملفات الاكسل</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>مقارنة ملفات الاكسل</h1>
        <div class="upload-section">
            <div class="file-upload" id="file-1-container">
                <h3>الملف الأول</h3>
                <input type="file" id="file-1" accept=".xlsx, .xls">
                <div id="file-1-info" class="file-info"></div>
                <select id="file-1-cols" class="column-select" style="display:none;"></select>
            </div>
            <div class="file-upload" id="file-2-container">
                <h3>الملف الثاني</h3>
                <input type="file" id="file-2" accept=".xlsx, .xls">
                <div id="file-2-info" class="file-info"></div>
                <select id="file-2-cols" class="column-select" style="display:none;"></select>
            </div>
        </div>
        <div id="compare-section" style="display:none;">
            <button id="compare-btn" class="btn">مقارنة</button>
        </div>
        <div id="download-section" style="display:none;">
            <a id="download-link" href="#" class="btn download-btn">تحميل النتيجة</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
